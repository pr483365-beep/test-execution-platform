server:
  port: 8081

spring:
  application:
    name: project-service

  datasource:
    url: jdbc:mysql://localhost:3306/project_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true